<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Typing Test</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial;
  background:#efefef;
}

/* NAVBAR */

.navbar{
  background:#1ea4e9;
  color:white;
  padding:15px 30px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:35px;
  font-weight:bold;
}

/* HOME SCREEN */

.home{
  max-width:900px;
  margin:60px auto;
}

.home h1{
  text-align:center;
  font-size:55px;
  margin-bottom:40px;
}

.test-box{
  background:white;
  padding:25px;
  margin-bottom:20px;
  border-radius:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.test-box h2{
  font-size:35px;
}

.start-btn{
  background:#ffd43b;
  border:none;
  padding:15px 35px;
  border-radius:10px;
  font-size:22px;
  font-weight:bold;
  cursor:pointer;
}

.start-btn:hover{
  background:#ffc107;
}

/* TEST SCREEN */

.test-screen{
  display:none;
}

.typing-container{
  max-width:1500px;
  margin:40px auto;
  background:white;
  padding:40px;
  border-radius:20px;
}

.text{
  font-size:58px;
  line-height:95px;
  letter-spacing:5px;
  color:#444;
  font-family:monospace;
  word-wrap:break-word;
}

.correct{
  color:green;
}

.wrong{
  color:red;
}

.current{
  color:#2196f3;
  border-bottom:5px solid #2196f3;
}

textarea{
  position:absolute;
  opacity:0;
  z-index:-1;
}

</style>
</head>
<body>

<!-- HOME -->

<div class="home" id="home">

  <h1>Typing Tests</h1>

  <div class="test-box">

    <h2>1:00 Test</h2>

    <button class="start-btn" onclick="startTest(1)">
      Start Test
    </button>

  </div>

  <div class="test-box">

    <h2>3:00 Test</h2>

    <button class="start-btn" onclick="startTest(3)">
      Start Test
    </button>

  </div>

  <div class="test-box">

    <h2>5:00 Test</h2>

    <button class="start-btn" onclick="startTest(5)">
      Start Test
    </button>

  </div>

</div>

<!-- TEST SCREEN -->

<div class="test-screen" id="testScreen">

  <div class="navbar">

    <div>typing.com</div>

    <div id="timer">03:00</div>

  </div>

  <div class="typing-container">

    <div class="text" id="text"></div>

  </div>

  <textarea id="input"></textarea>

</div>

<script>

const text =
"Dogs often love attending a dog agility training class. They're given the opportunity to work in a new environment with ramps jumps poles and tires that are colorful and inviting.";

let time = 0;
let timer;
let charIndex = 0;

const textDiv = document.getElementById("text");
const input = document.getElementById("input");

/* LOAD TEXT */

function loadText(){

  textDiv.innerHTML = "";

  text.split("").forEach((char,index)=>{

    const span = document.createElement("span");

    span.innerText = char;

    if(index === 0){
      span.classList.add("current");
    }

    textDiv.appendChild(span);

  });

}

loadText();

/* START TEST */

function startTest(minutes){

  time = minutes * 60;

  document.getElementById("home").style.display = "none";

  document.getElementById("testScreen").style.display = "block";

  input.focus();

  updateTimer();

  timer = setInterval(()=>{

    time--;

    updateTimer();

    if(time <= 0){

      clearInterval(timer);

      alert("Test Finished");

    }

  },1000);

}

/* TIMER */

function updateTimer(){

  let minutes = Math.floor(time / 60);

  let seconds = time % 60;

  if(seconds < 10){
    seconds = "0" + seconds;
  }

  document.getElementById("timer").innerHTML =
  minutes + ":" + seconds;

}

/* TYPING */

input.addEventListener("keydown",(e)=>{

  const characters = textDiv.querySelectorAll("span");

  /* BACKSPACE */

  if(e.key === "Backspace"){

    e.preventDefault();

    if(charIndex > 0){

      characters[charIndex].classList.remove("current");

      charIndex--;

      characters[charIndex].classList.remove("correct");
      characters[charIndex].classList.remove("wrong");

      characters[charIndex].classList.add("current");

    }

    return;

  }

  /* SPACE */

  if(e.key === " "){

    e.preventDefault();

  }

  /* NORMAL KEYS */

  if(e.key.length === 1){

    if(e.key === text.charAt(charIndex)){

      characters[charIndex].classList.add("correct");

    }else{

      characters[charIndex].classList.add("wrong");

    }

    characters[charIndex].classList.remove("current");

    charIndex++;

    if(characters[charIndex]){

      characters[charIndex].classList.add("current");

    }

  }

});

/* AUTO FOCUS */

document.body.addEventListener("click",()=>{

  input.focus();

});

</script>

</body>
</html>
